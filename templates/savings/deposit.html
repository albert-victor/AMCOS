{% extends 'base.html' %}
{% block title %}Deposit Savings{% endblock %}
{% block page_title %}Deposit to {{ account.account_number }}{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h3>Make Deposit</h3></div>
    <div class="card-body">
        <p>Current Balance: <strong>{{ account.balance|floatformat:2 }}</strong></p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Amount</label>
                <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required>
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select name="payment_method" class="form-control">
                    <option value="cash">Cash</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="bank_transfer">Bank Transfer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" class="form-control">
            </div>
            <button type="submit" class="btn btn-success">Deposit</button>
            <a href="{% url 'savings:detail' account.id %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
