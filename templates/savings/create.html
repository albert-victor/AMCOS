{% extends 'base.html' %}
{% block title %}Create Savings Account{% endblock %}
{% block page_title %}New Savings Account{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h3>Create Account</h3></div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Member</label>
                <select name="member_id" class="form-control" required>
                    <option value="">Select Member</option>
                    {% for m in members %}
                    <option value="{{ m.id }}">{{ m.member_number }} - {{ m.first_name }} {{ m.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Account Type</label>
                <select name="account_type" class="form-control" required>
                    <option value="voluntary">Voluntary Savings</option>
                    <option value="mandatory">Mandatory Savings</option>
                    <option value="fixed_deposit">Fixed Deposit</option>
                    <option value="special">Special Savings</option>
                </select>
            </div>
            <div class="form-group">
                <label>Interest Rate (%)</label>
                <input type="number" name="interest_rate" class="form-control" step="0.01" value="3.00">
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
    </div>
</div>
{% endblock %}
