{% extends 'base.html' %}
{% block title %}<span class="lang-sw">Hariri Ushirika</span><span class="lang-en">Edit Cooperative</span>{% endblock %}
{% block page_title %}<span class="lang-sw">Hariri Ushirika</span><span class="lang-en">Edit Cooperative</span>{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;margin:0 auto;">
    <div class="card-header">
        <h3>{{ cooperative.name }}</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label><span class="lang-sw">Jina la Ushirika</span><span class="lang-en">Cooperative Name</span></label>
                <input type="text" name="name" class="form-control" value="{{ cooperative.name }}" required>
            </div>
            <div class="form-group">
                <label><span class="lang-sw">Aina</span><span class="lang-en">Type</span></label>
                <select name="type" class="form-control">
                    <option value="amcos" {% if cooperative.type == 'amcos' %}selected{% endif %}>AMCOS</option>
                    <option value="sacco" {% if cooperative.type == 'sacco' %}selected{% endif %}>SACCO</option>
                    <option value="vikoba" {% if cooperative.type == 'vikoba' %}selected{% endif %}>VICOBA</option>
                    <option value="credit_union" {% if cooperative.type == 'credit_union' %}selected{% endif %}>Credit Union</option>
                    <option value="farmers" {% if cooperative.type == 'farmers' %}selected{% endif %}>Farmers Cooperative</option>
                    <option value="other" {% if cooperative.type == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><span class="lang-sw">Simu</span><span class="lang-en">Phone</span></label>
                    <input type="text" name="phone" class="form-control" value="{{ cooperative.phone }}">
                </div>
                <div class="form-group">
                    <label><span class="lang-sw">Barua Pepe</span><span class="lang-en">Email</span></label>
                    <input type="email" name="email" class="form-control" value="{{ cooperative.email }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><span class="lang-sw">Mji</span><span class="lang-en">City</span></label>
                    <input type="text" name="city" class="form-control" value="{{ cooperative.city }}">
                </div>
                <div class="form-group">
                    <label><span class="lang-sw">Mkoa</span><span class="lang-en">Region</span></label>
                    <input type="text" name="region" class="form-control" value="{{ cooperative.region }}">
                </div>
            </div>
            <div class="form-group">
                <label><span class="lang-sw">Mpango</span><span class="lang-en">Plan</span></label>
                <select name="subscription_plan" class="form-control">
                    <option value="free" {% if cooperative.subscription_plan == 'free' %}selected{% endif %}>Free</option>
                    <option value="basic" {% if cooperative.subscription_plan == 'basic' %}selected{% endif %}>Basic</option>
                    <option value="professional" {% if cooperative.subscription_plan == 'professional' %}selected{% endif %}>Professional</option>
                    <option value="enterprise" {% if cooperative.subscription_plan == 'enterprise' %}selected{% endif %}>Enterprise</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i>  <span class="lang-sw">Hifadhi Mabadiliko</span><span class="lang-en">Save Changes</span></button>
            <a href="{% url 'core:super_admin_dashboard' %}" class="btn btn-secondary"><span class="lang-sw">Ghairi</span><span class="lang-en">Cancel</span></a>
        </form>
    </div>
</div>
{% endblock %}
