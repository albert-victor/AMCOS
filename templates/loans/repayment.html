{% extends 'base.html' %}
{% block title %}Loan Repayment{% endblock %}
{% block page_title %}Repayment: {{ loan.loan_number }}{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h3>Record Repayment</h3></div>
    <div class="card-body">
        <p>Outstanding Balance: <strong>{{ loan.balance|floatformat:2 }}</strong></p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Amount</label>
                <input type="number" name="amount" class="form-control" step="0.01" min="0.01" max="{{ loan.balance }}" required>
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select name="payment_method" class="form-control">
                    <option value="cash">Cash</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="bank_transfer">Bank Transfer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Record Repayment</button>
            <a href="{% url 'loans:detail' loan.id %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
