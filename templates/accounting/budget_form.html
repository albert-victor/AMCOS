{% extends 'base.html' %}
{% block title %}Create Budget{% endblock %}
{% block page_title %}Create Budget{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h3>New Budget Entry</h3></div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Fiscal Year</label>
                <input type="text" name="fiscal_year" class="form-control" placeholder="e.g., 2026" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" name="category" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Budgeted Amount</label>
                <input type="number" name="budgeted_amount" class="form-control" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Budget</button>
            <a href="{% url 'accounting:budget_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
