{% extends 'base.html' %}
{% block title %}Create Account{% endblock %}
{% block page_title %}New Account{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h3>Create Chart of Account</h3></div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Account Code</label>
                <input type="text" name="account_code" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Account Name</label>
                <input type="text" name="account_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Account Type</label>
                <select name="account_type" class="form-control" required>
                    <option value="asset">Asset</option>
                    <option value="liability">Liability</option>
                    <option value="equity">Equity</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
            <a href="{% url 'accounting:chart_of_accounts' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
